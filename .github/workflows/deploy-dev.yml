
name: Deploy Task Tracker

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - stage
      - master

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
          STAGE_HOST: ${{ secrets.STAGE_HOST }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -e

          case "$BRANCH" in
            develop) HOST="$DEV_HOST" ;;
            stage)   HOST="$STAGE_HOST" ;;
            master)  HOST="$PROD_HOST" ;;
            *) exit 1 ;;
          esac

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$SSH_USERNAME@$HOST" \
            "COMMIT_SHA='$COMMIT_SHA' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -e

          APP_DIR=/opt/task-tracker
          REPO=https://github.com/ritesh-devops-poc/riteshdevops-task-tracker.git

          if ! command -v node >/dev/null || ! node -v | grep -q '^v22\.'; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates git
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          if [ ! -d "$APP_DIR/.git" ]; then
            sudo mkdir -p "$APP_DIR"
            sudo chown ubuntu:ubuntu "$APP_DIR"
            git clone "$REPO" "$APP_DIR"
          fi

          git -C "$APP_DIR" fetch origin "$BRANCH"
          git -C "$APP_DIR" checkout --force "$COMMIT_SHA"
          cd "$APP_DIR"
          npm ci --omit=dev

          sudo systemctl restart task-tracker
          sudo systemctl is-active --quiet task-tracker

          echo "Deployment successful: $COMMIT_SHA"
          REMOTE
