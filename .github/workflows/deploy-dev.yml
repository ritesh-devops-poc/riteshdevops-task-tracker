name: Deploy Task Tracker

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [develop, stage, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy Application
    if: github.event.pull_request.merged == true
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
          STAGE_HOST: ${{ secrets.STAGE_HOST }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}

        run: |
          set -e

          case "$BRANCH" in
            develop) HOST="$DEV_HOST" ;;
            stage) HOST="$STAGE_HOST" ;;
            master) HOST="$PROD_HOST" ;;
            *) echo "Unsupported branch: $BRANCH"; exit 1 ;;
          esac

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key \
            "$SSH_USERNAME@$HOST" \
            "COMMIT_SHA='$COMMIT_SHA' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -e

          APP=/opt/task-tracker
          REPO=https://github.com/ritesh-devops-poc/riteshdevops-task-tracker.git

          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates

          if ! node -v 2>/dev/null | grep -q '^v22\.'; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          if [ ! -d "$APP/.git" ]; then
            sudo mkdir -p "$APP"
            sudo chown ubuntu:ubuntu "$APP"
            git clone "$REPO" "$APP"
          fi

          git -C "$APP" fetch origin "$BRANCH"
          git -C "$APP" checkout --force "$COMMIT_SHA"

          # Install production application dependencies.
          cd "$APP"
          npm ci --omit=dev

          # Create the service only if it does not already exist.
          if ! sudo test -f /etc/systemd/system/task-tracker.service; then
            sudo tee /etc/systemd/system/task-tracker.service >/dev/null <<'SERVICE'
          [Unit]
          Description=Task Tracker
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/opt/task-tracker
          EnvironmentFile=/etc/task-tracker.env
          ExecStart=/usr/bin/node /opt/task-tracker/app.js
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE
          fi

          sudo systemctl daemon-reload
          sudo systemctl enable task-tracker
          sudo systemctl restart task-tracker

          sleep 3
          sudo systemctl is-active --quiet task-tracker

          echo "Application deployment successful: $COMMIT_SHA"
          REMOTE